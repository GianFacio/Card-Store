<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marlon Vera Slab | Beans Jeans Card Club</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a class="logo" href="/">Beans Jeans Card Club</a>
        <nav><a href="index.html">Home</a></nav>
    </header>
    <main class="slab-showcase">
        <div class="slab-info">
            <p class="slab-grade">PSA 9 · Marlon Vera</p>
            <h1>2024 Topps UFC Knockout Gallery Graphs</h1>
            <p>Card details and front/back views of the slab.</p>
            <strong class="slab-price">$100.00</strong>
            <a class="collection-link" href="index.html">Back to cards</a>
        </div>
        <section class="slab-viewer" aria-label="Marlon Vera slab photos">
            <button id="previous-photo" class="slab-arrow" type="button" aria-label="Previous photo">&lsaquo;</button>
            <figure>
                <img id="slab-image" src="images/marlon-slab.jpg" alt="Front of Marlon Vera PSA slab">
                <figcaption id="slab-caption">Front of Marlon Vera PSA slab (1 of 2)</figcaption>
            </figure>
            <button id="next-photo" class="slab-arrow" type="button" aria-label="Next photo">&rsaquo;</button>
            <div class="slab-photo-select" aria-label="Choose slab side">
                <button class="slab-side active" type="button" data-photo="0">Front</button>
                <button class="slab-side" type="button" data-photo="1">Back</button>
            </div>
        </section>
    </main>
    <footer>Beans Jeans Card Club</footer>

    <script>
        const photos = [
            { src: 'images/marlon-slab.jpg', alt: 'Front of Marlon Vera PSA slab' },
            { src: 'images/marlon-slab-back.jpg', alt: 'Back of Marlon Vera PSA slab' }
        ];
        const image = document.querySelector('#slab-image');
        const caption = document.querySelector('#slab-caption');
        const sideButtons = document.querySelectorAll('.slab-side');
        let currentPhoto = 0;

        function showPhoto(index) {
            currentPhoto = (index + photos.length) % photos.length;
            image.src = photos[currentPhoto].src;
            image.alt = photos[currentPhoto].alt;
            caption.textContent = `${photos[currentPhoto].alt} (${currentPhoto + 1} of ${photos.length})`;
            sideButtons.forEach((button, buttonIndex) => {
                button.classList.toggle('active', buttonIndex === currentPhoto);
            });
        }

        document.querySelector('#previous-photo').addEventListener('click', () => showPhoto(currentPhoto - 1));
        document.querySelector('#next-photo').addEventListener('click', () => showPhoto(currentPhoto + 1));
        sideButtons.forEach(button => {
            button.addEventListener('click', () => showPhoto(Number(button.dataset.photo)));
        });
    </script>
</body>

</html>
