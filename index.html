<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beans Jeans Card Club</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a class="logo" href="/">Beans Jeans Card Club</a>
        <nav><a href="#shop">Cards</a></nav>
    </header>
    <main id="shop">
        <h2>Card Collection</h2>
        <div class="filters">
            <button class="filter active" data-kind="all">All cards</button>
            <button class="filter" data-kind="Raw">Raw</button>
            <button class="filter" data-kind="PSA 10">PSA 10</button>
            <button class="filter" data-kind="PSA 9">PSA 9</button>
            <button class="filter" data-kind="PSA 8">PSA 8</button>
            <button class="filter" data-kind="PSA 7">PSA 7</button>
            <button class="filter" data-kind="PSA 6">PSA 6</button>
            <button class="filter" data-kind="PSA 5">PSA 5</button>
            <button class="filter" data-kind="PSA 4">PSA 4</button>
            <button class="filter" data-kind="PSA 3">PSA 3</button>
            <button class="filter" data-kind="PSA 2">PSA 2</button>
            <button class="filter" data-kind="PSA 1">PSA 1</button>
        </div>
        <div class="products" id="products"></div>
    </main>
    <footer>Beans Jeans Card Club</footer>

    <script>
        const items = [{
            name: '2024 Topps UFC Knockout Marlon Vera Gallery Graphs',
            detail: 'Marlon Vera',
            price: 100,
            kind: 'PSA 9',
            photo: 'images/marlon-slab.jpg',
            photoAlt: 'Front of Marlon Vera PSA slab'
        }];

        const products = document.querySelector('#products');

        function show(kind = 'all') {
            products.innerHTML = items.filter(item => kind === 'all' || item.kind === kind).map(item =>
                `<article class="product">
                    <a class="product-image-button" href="/collection.html" aria-label="View photos of ${item.name}">
                        <img src="${item.photo}" alt="${item.photoAlt}">
                    </a>
                    <h3>${item.name}</h3>
                    <div class="price-row"><strong>$${item.price.toFixed(2)}</strong></div>
                    <div class="detail">${item.detail}</div>
                </article>`
            ).join('');
        }

        document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
            document.querySelector('.filter.active').classList.remove('active');
            button.classList.add('active');
            show(button.dataset.kind);
        }));

        show();
    </script>
</body>

</html>
